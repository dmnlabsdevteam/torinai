# NATS Server Configuration for TorinAI
port: 4222
server_name: torinai_nats

# JetStream Configuration
jetstream {
    store_dir: "/tmp/nats/jetstream"
    max_memory: 1GB
    max_file: 10GB
}

# Monitoring
monitor_port: 8222

# Logging
log_file: "/tmp/nats/nats.log"
logtime: true
debug: false
trace: false

# Accounts - credentials from environment variables for security
# NATS_ADMIN_USER and NATS_ADMIN_PASSWORD must be set in .env
accounts {
    torinai: {
        users: [
            {user: $NATS_ADMIN_USER, password: $NATS_ADMIN_PASSWORD}
        ]
        jetstream: enabled
    }
}

# Authorization
authorization {
    default_permissions: {
        publish: {
            allow: ["drift.>", "agent.>", "monitor.>"]
        }
        subscribe: {
            allow: ["drift.>", "agent.>", "monitor.>"]
        }
    }
}